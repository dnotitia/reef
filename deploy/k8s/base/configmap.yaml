apiVersion: v1
kind: ConfigMap
metadata:
  name: reef-web-config
data:
  # Explicit auth profile. The public base defaults to local AKB JWT auth; an
  # SSO overlay must replace this and provide the dedicated Keycloak/Redis
  # settings documented in docs/keycloak-sso.md.
  REEF_AUTH_MODE: "local"
  # akb backend — reef-web reaches the akb backend over cluster-internal
  # DNS. This is a neutral placeholder; the operator overrides it in their
  # overlay with the real Service DNS (namespace + Service name differ per
  # cluster), e.g. http://backend.<akb-namespace>.svc.cluster.local:8000.
  AKB_BACKEND_URL: "http://akb-backend.example.svc.cluster.local:8000"
  # reef-web's canonical public origin. In SSO mode it forms Reef's exact OIDC
  # callback and post-logout URLs. Bare origin only (no path/query/fragment),
  # https for non-loopback; must match the ingress host (ingress.yaml).
  REEF_PUBLIC_ORIGIN: "https://reef.example.com"
  # Production SSO overlays must provide a distinct in-cluster Keycloak realm
  # URL for token, JWKS, revocation, and readiness traffic. The exact realm
  # path must match REEF_KEYCLOAK_ISSUER; never point this at public ingress.
  # REEF_KEYCLOAK_TRANSPORT_URL: "http://keycloak.identity.svc.cluster.local:8080/realms/reef"
  # akb web app base (REEF-083 / REEF-368). reef-web has no in-app document
  # viewer, so a linked akb document's "open" action points at akb's own
  # frontend at this origin. Read on the SERVER at runtime, so setting it here is
  # enough — no image rebuild. Optional: leave unset and the linked-document card
  # hides its open action and offers copy only. The legacy `NEXT_PUBLIC_AKB_WEB_URL`
  # key is still honored for back-compat.
  # AKB_WEB_URL: "https://akb.example.com"
  # Production mode enables the Secure cookie flag and the strict
  # (no unsafe-eval) CSP. Must be `production` in-cluster.
  NODE_ENV: "production"
  # Optional LLM capability. An overlay must set REEF_LLM_BASE_URL and
  # REEF_LLM_MODEL together with REEF_LLM_API_KEY in `reef-web-secret`.
  # Leaving all three absent is a valid AI-disabled deployment.
  # OpenTelemetry trace export — optional, no-op when unset. Wire this only
  # after an OTLP collector / Langfuse is deployed and reachable in-cluster.
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.example.svc.cluster.local:4318"
