apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Example overlay — the template every deployment starts from. Copy this
# directory to overlays/<your-env>/ and edit the three override points:
#   1. namespace          — where reef-web runs
#   2. patch-config.yaml  — AKB_BACKEND_URL + REEF_PUBLIC_ORIGIN
#   3. patch-ingress.yaml — public host (tls + rules)
# The base itself is never deployed directly.

# Namespace reef-web runs in. The namespace is assumed to already exist
# (reef-web does not create it).
namespace: reef

resources:
  - ../../base

patches:
  - path: patch-config.yaml
  - path: patch-ingress.yaml
