name: Live AKB Contract

# Live contract smoke against a real AKB backend.
#
# Kept OFF the PR hot path (a separate workflow, never `pull_request`): it
# source-builds AKB and needs Docker, so it is slow. The static contract tests
# still run on every PR via ci.yml against captured responses; this is the live
# drift detector that complements them.
on:
  push:
    branches: [main]
  schedule:
    # Nightly drift sweep. The `main` akb_ref leg below is the whole point: it
    # builds akb's latest and fails if the live wire shape drifted.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

# Least-privilege: only read the checked-out repos (both reef and public akb).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-akb-contract:
    name: Live AKB contract (akb ${{ matrix.akb_ref }})
    runs-on: ubuntu-latest
    strategy:
      # One leg failing must not cancel the other — we want both signals (a
      # pinned-ref regression vs. a `main` drift) on every run.
      fail-fast: false
      matrix:
        # The pinned leg keeps the reproducible regression signal for the
        # scenarios that existed at that ref. The moving leg exercises the
        # current app-control-plane fixture and its app-principal reader.
        include:
          - akb_ref: b28b345e687ae35441abec545961c9d09b39ea18
            scenario: app-installation-lifecycle
            lane: pinned
          - akb_ref: main
            scenario: app-control-plane
            lane: moving
    steps:
      - name: Checkout reef
        uses: actions/checkout@v5

      # akb is public, so no token is needed — just pin the ref.
      - name: Checkout akb
        uses: actions/checkout@v5
        with:
          repository: dnotitia/akb
          ref: ${{ matrix.akb_ref }}
          path: .akb-live

      - name: Setup Python for AKB runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: ""

      - name: Setup uv for AKB runtime
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: false
          restore-cache: false
          save-cache: false

      - name: Install AKB runtime dependencies
        working-directory: .akb-live
        run: uv sync --locked --extra dev --project backend

      # Do not restore or save tool caches: matrix.akb_ref selects external
      # code, and this workflow runs on scheduled/manual privileged events.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: ""
          package-manager-cache: false

      - name: Install Reef dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live AKB contract smoke
        run: |
          set -euo pipefail

          akb_checkout="${GITHUB_WORKSPACE}/.akb-live"
          runtime_root="${RUNNER_TEMP}/akb-e2e-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.lane }}"
          descriptor_path="${RUNNER_TEMP}/reef-live-akb-descriptor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.lane }}.json"
          discovery_path="${RUNNER_TEMP}/reef-live-akb-discovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.lane }}.json"
          reset_path="${RUNNER_TEMP}/reef-live-akb-reset-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.lane }}.json"
          runtime_log="${RUNNER_TEMP}/reef-live-akb-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.lane }}.log"
          export REEF_SCENARIO="${{ matrix.scenario }}"
          export AKB_E2E_USERNAME="akb-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.lane }}"
          export AKB_E2E_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          export DESCRIPTOR_PATH="$descriptor_path"
          export DISCOVERY_PATH="$discovery_path"
          export RESET_PATH="$reset_path"

          runtime_pid=""
          cleanup() {
            reef_exit=$?
            trap - EXIT
            if [[ -n "$runtime_pid" ]]; then
              kill -TERM "$runtime_pid" 2>/dev/null || true
              wait "$runtime_pid" 2>/dev/null || true
            fi
            unset AKB_E2E_USERNAME AKB_E2E_PASSWORD
            exit "$reef_exit"
          }
          trap cleanup EXIT

          (
            cd "$akb_checkout"
            exec uv run --locked --project backend \
              python backend/scripts/ci/e2e_runtime.py serve \
              --scenario "$REEF_SCENARIO" \
              --checkout "$akb_checkout" \
              --runtime-root "$runtime_root" \
              >"$descriptor_path" 2>"$runtime_log"
          ) &
          runtime_pid=$!

          for reef_wait in $(seq 1 240); do
            if [[ -s "$descriptor_path" ]]; then
              break
            fi
            if ! kill -0 "$runtime_pid" 2>/dev/null; then
              echo "AKB runtime exited before publishing its descriptor; raw logs remain private at $runtime_log" >&2
              exit 1
            fi
            sleep 1
          done
          test -s "$descriptor_path"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          descriptor = json.loads(Path(os.environ["DESCRIPTOR_PATH"]).read_text())
          assert descriptor["schema_version"] == 2
          assert descriptor["status"] == "ready"
          assert descriptor["scenario"] == os.environ["REEF_SCENARIO"]
          assert set(descriptor["services"]) == {"app", "fixture"}
          credentials = descriptor["credentials"]
          assert credentials == {
              "username_env": "AKB_E2E_USERNAME",
              "password_env": "AKB_E2E_PASSWORD",
              "login_path": "/api/v1/auth/login",
          }
          assert descriptor["services"]["fixture"]["reset"]["body"] == {
              "scenario": os.environ["REEF_SCENARIO"]
          }
          serialized = json.dumps(descriptor, sort_keys=True)
          for private in (os.environ["AKB_E2E_USERNAME"], os.environ["AKB_E2E_PASSWORD"]):
              assert private not in serialized
          print(f"schema-v2 runtime descriptor validated: scenario={descriptor['scenario']}, credential_values=omitted")
          PY

          export REEF_LIVE_AKB_URL="$(DESCRIPTOR_PATH="$descriptor_path" python -c 'import json, os; print(json.load(open(os.environ["DESCRIPTOR_PATH"]))["services"]["app"]["origin"])')"
          export REEF_LIVE_AKB_FIXTURE_URL="$(DESCRIPTOR_PATH="$descriptor_path" python -c 'import json, os; print(json.load(open(os.environ["DESCRIPTOR_PATH"]))["services"]["fixture"]["origin"])')"

          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "{\"scenario\":\"$REEF_SCENARIO\"}" \
            "$REEF_LIVE_AKB_FIXTURE_URL/reset" \
            --output "$reset_path"
          curl --fail --silent --show-error \
            "$REEF_LIVE_AKB_FIXTURE_URL/discover" \
            --output "$discovery_path"

          # Validate discovery before Vitest so a runtime-coordinate mismatch
          # cannot be hidden by a stale or invented test fixture.
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          discovery = json.loads(Path(os.environ["DISCOVERY_PATH"]).read_text())
          scenario = os.environ["REEF_SCENARIO"]
          assert discovery["status"] == "ready"
          assert discovery["scenario"] == scenario
          assert discovery["access"]["login"] == {
              "service": "app",
              "method": "POST",
              "path": "/api/v1/auth/login",
              "fields": ["username", "password"],
          }
          serialized = json.dumps(discovery, sort_keys=True)
          for private in (os.environ["AKB_E2E_USERNAME"], os.environ["AKB_E2E_PASSWORD"]):
              assert private not in serialized
          if scenario == "app-control-plane":
              uuid_pattern = r"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}"
              runtime = discovery["runtime"]
              assert re.fullmatch(r"[0-9a-f]{7,64}", runtime["source_revision"], re.I)
              target_app_id = discovery["apps"]["target"]["id"]
              assert re.fullmatch(uuid_pattern, target_app_id, re.I)
              installations = discovery["installations"]
              assert isinstance(installations, list) and installations
              for installation in installations:
                  assert isinstance(installation, dict)
                  assert re.fullmatch(uuid_pattern, installation["id"], re.I)
                  assert re.fullmatch(uuid_pattern, installation["vault_id"], re.I)
                  assert isinstance(installation["fixture_id"], str)
              scope_case = discovery["scope_cases"]["other_app"]
              assert scope_case["app_id"] != target_app_id
              for key in ("app_id", "vault_id", "installation_id"):
                  assert re.fullmatch(uuid_pattern, scope_case[key], re.I)
              coordinates = discovery["coordinates"]
              assert coordinates["installation_status"]["method"] == "GET"
              assert coordinates["admin"]["credential"]["method"] == "POST"
              assert coordinates["admin"]["exchange"] == {
                  "service": "app",
                  "method": "POST",
                  "path": "/api/v1/auth/app-token",
                  "body": {"credential": "<issued-value>"},
              }
              print("fixture discovery validated: app-control-plane active installations and other-app scope present")
          else:
              print(f"fixture discovery validated: scenario={scenario}, app-control-plane coordinates not claimed")
          PY

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          reset = json.loads(Path(os.environ["RESET_PATH"]).read_text())
          assert reset == {"status": "ready", "scenario": os.environ["REEF_SCENARIO"]}
          print(f"fixture reset validated: scenario={reset['scenario']}")
          PY

          echo "live AKB runtime contract validated: reef_sha=$(git rev-parse HEAD) akb_ref=${{ matrix.akb_ref }} scenario=$REEF_SCENARIO"
          pnpm --filter @reef/core test:live-akb
