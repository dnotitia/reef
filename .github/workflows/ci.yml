name: CI

on:
  pull_request:
    branches:
      - main
  # Merge queue. When a PR enters the queue GitHub builds a temporary
  # `gh-readonly-queue/main/...` ref — the PR merged onto the *current* tip of
  # main — and fires `merge_group`. Exact-tree evidence lets that event reuse a
  # successful PR run only when the PR head, resulting Git tree, and workflow
  # are identical. A changed base or grouped queue tree falls back to full CI.
  merge_group:
  # Intentionally NOT `push: branches: [main]`. The merge queue is the only path
  # to main, so the commit it fast-forwards onto main is byte-identical to the
  # `merge_group` ref CI just validated — a push run here would re-test that exact
  # commit a third time for no new signal. (Live-drift detection on main is a
  # separate concern owned by live-akb-contract.yml, which keeps its own push
  # trigger.) If direct pushes to main are ever allowed again, restore this.

# Least-privilege default: jobs read the repo, and the reuse decision reads the
# immutable evidence artifacts published by earlier CI runs.
permissions:
  actions: read
  contents: read

# Cancel superseded runs for the same workflow + ref (e.g. new pushes to a PR).
# Each merge-queue entry gets its own unique `gh-readonly-queue/...` ref, so
# queued runs never cancel one another — only repeated events on the same ref do.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-pr-ci:
    name: PR CI reuse decision
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'merge_group' }}
    outputs:
      reuse: ${{ steps.evidence.outputs.reuse }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Find exact-tree PR CI evidence
        id: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/merge-group-evidence.mjs resolve

  lint:
    name: Biome Check
    runs-on: ubuntu-latest
    needs: reuse-pr-ci
    if: ${{ always() && needs.reuse-pr-ci.outputs.reuse != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome check
        run: pnpm run lint

  package-contract:
    name: Package Contract / Architecture
    runs-on: ubuntu-latest
    needs: reuse-pr-ci
    if: ${{ always() && needs.reuse-pr-ci.outputs.reuse != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace package contract and architecture gate
        run: pnpm run check:package-contract

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    needs: reuse-pr-ci
    if: ${{ always() && needs.reuse-pr-ci.outputs.reuse != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace package artifacts
        run: pnpm run build:packages

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

  production-build:
    name: Next production artifact
    runs-on: ubuntu-latest
    needs: [reuse-pr-ci, lint, typecheck]
    if: ${{ always() && needs.reuse-pr-ci.outputs.reuse != 'true' && needs.lint.result == 'success' && needs.typecheck.result == 'success' }}
    outputs:
      sha256: ${{ steps.production_artifact.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the production artifact
        run: pnpm run build

      - name: Package and digest the production artifact
        id: production_artifact
        run: |
          pnpm run package:production-artifact
          sha256sum ci-artifacts/reef-web-production.tar.gz > ci-artifacts/reef-web-production.tar.gz.sha256
          printf '%s\n' "$GITHUB_SHA" > ci-artifacts/reef-web-production.commit
          digest=$(cut -d' ' -f1 ci-artifacts/reef-web-production.tar.gz.sha256)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload the production artifact
        uses: actions/upload-artifact@v5
        with:
          name: reef-web-production-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Vitest
    runs-on: ubuntu-latest
    needs: reuse-pr-ci
    if: ${{ always() && needs.reuse-pr-ci.outputs.reuse != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace package artifacts
        run: pnpm run build:packages

      - name: Run tests
        run: pnpm run test

  e2e-shard:
    # NOTE: the `/3` denominator here, in the matrix below, and in the
    # `--shard` flag are one logical value. `env:` is not available in a job
    # `name:`, so it is spelled out literally — keep all three in sync.
    name: E2E (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Gate only on the *fast* checks plus the single production artifact. Vitest used to be a
    # `needs` here too, which serialized the whole ~2.5min unit suite ahead of
    # E2E even though the two are independent — now they run in parallel. We
    # still gate on lint/typecheck and the exact production build so E2E does
    # not burn runner time on an artifact that cannot even compile.
    needs: [reuse-pr-ci, lint, typecheck, production-build]
    if: ${{ always() && needs.reuse-pr-ci.outputs.reuse != 'true' && needs.lint.result == 'success' && needs.typecheck.result == 'success' && needs.production-build.result == 'success' }}
    strategy:
      # One shard failing should not cancel the others — we want every shard's
      # result so a flake in one is not masked by an early abort in another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the exact production artifact
        uses: actions/download-artifact@v5
        with:
          name: reef-web-production-${{ github.sha }}
          path: ci-artifacts

      - name: Verify and unpack the production artifact
        env:
          EXPECTED_ARTIFACT_SHA256: ${{ needs.production-build.outputs.sha256 }}
        run: |
          sha256sum -c ci-artifacts/reef-web-production.tar.gz.sha256
          actual=$(cut -d' ' -f1 ci-artifacts/reef-web-production.tar.gz.sha256)
          test "$actual" = "$EXPECTED_ARTIFACT_SHA256"
          test "$(cat ci-artifacts/reef-web-production.commit)" = "$GITHUB_SHA"
          tar -xzf ci-artifacts/reef-web-production.tar.gz -C .

      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(pnpm --filter @reef/web exec playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $version"

      # Cache the browser binaries (~/.cache/ms-playwright) keyed on the exact
      # Playwright version so a hit skips the download on every run. The cache
      # is invalidated only when Playwright itself is upgraded.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @reef/web exec playwright install --with-deps chromium

      # On a cache hit the binary is restored but the OS-level shared libs are
      # not (they live in apt, not the cached dir), so install just those.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @reef/web exec playwright install-deps chromium

      - name: Run Playwright E2E tests
        run: REEF_E2E_SKIP_BUILD=1 pnpm --filter @reef/web run test:e2e:sharded -- --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          # CI uses Playwright's `github` reporter, which does not create the
          # HTML `playwright-report/` directory. Retry traces and error context
          # are written here instead.
          path: packages/web/test-results/
          if-no-files-found: error
          retention-days: 7

  # Stable aggregate gate. Branch protection requires the context "Playwright
  # E2E"; the sharded matrix jobs report under per-shard names, so this job
  # keeps that exact name and passes only when every shard passed. A `skipped`
  # matrix (because lint/typecheck gated E2E out) is treated as non-blocking;
  # those failed gates already block the PR on their own required checks.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [reuse-pr-ci, e2e-shard, production-build]
    if: ${{ always() && needs.reuse-pr-ci.outputs.reuse != 'true' && !cancelled() }}
    steps:
      - name: Aggregate E2E shard results
        run: |
          result='${{ needs.e2e-shard.result }}'
          artifact_result='${{ needs.production-build.result }}'
          echo "E2E shard matrix result: $result"
          echo "Production artifact result: $artifact_result"
          case "$artifact_result:$result" in
            success:success|success:skipped) exit 0 ;;
            *) echo "::error::One or more Playwright E2E shards failed"; exit 1 ;;
          esac
