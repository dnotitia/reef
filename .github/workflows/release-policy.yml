name: Release Policy

# Release-policy / changelog discipline for release tags. This is a lint, not a
# release: it never tags or publishes. Pull requests run the same check in the
# main CI workflow so package-contract and release-policy validation share setup.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-policy:
    name: Release Policy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # The release gate rebuilds the framework-agnostic core artifact so the
      # committed Blueprint is checked against the schema SSOT.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release policy check
        run: pnpm run check:release
