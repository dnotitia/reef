packages:
  - "packages/*"
  - "packages/orchestration/runtime"
  - "packages/orchestration/controller"
  - "packages/orchestration/cli"
  - "packages/orchestration/providers/*"

catalog:
  "@octokit/rest": ^21.1.1
  "@opentelemetry/api": ^1.9.1
  "@types/node": ^24.13.3
  msw: 2.15.0
  tsx: 4.23.9
  typescript: ^6.0.2
  vitest: ^4.1.10
  zod: ^4.4.3

pmOnFail: download

allowBuilds:
